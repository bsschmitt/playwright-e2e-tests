name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Instalar browsers
        run: npx playwright install --with-deps

      - name: Rodar Testes - Básico
        run: npx playwright test tests/basic

      - name: Rodar Testes - Fixtures
        run: npx playwright test tests/fixtures

  advanced-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci

      - name: Instalar o Playwright
        run: npx playwright install --with-deps

      - name: Rodar Testes - Avançado
        run: npx playwright test --config=playwright.advanced.config.ts

      - name: Gerar relatório HTML
        if: always()
        run: npx playwright show-report --reporter=html || true

      - name: Upload relatório
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
